[project]
name = "sixdrepnet360"
version = "0.1.0"
description = "Head pose estimation in PyTorch"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Thorsten Hempel", email = "tho.hemp@protonmail.com" },
    { name = "Jean-Pierre De Jesus DIAZ", email = "me@jeandudey.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
