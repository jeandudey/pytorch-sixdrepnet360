[project]
name = "sixdrepnet360"
version = "0.1.0"
description = "Head pose estimation in PyTorch"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Thorsten Hempel", email = "tho.hemp@protonmail.com" },
    { name = "Jean-Pierre De Jesus DIAZ", email = "me@jeandudey.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
sixdrepnet360-test = "sixdrepnet360.test:main"
sixdrepnet360-export = "sixdrepnet360.export:main"
sixdrepnet360-train = "sixdrepnet360.train:main"

[project.optional-dependencies]
export = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
]
train = [
    "albumentationsx>=2.4.13",
    "tensorboard>=2.21.0",
]
rocm = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "triton-rocm>=3.8.0; sys_platform == 'linux'",
]
cuda = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "PTH", "RET", "SIM", "RUF", "NPY", "PERF", "C4"]

[tool.ty.rules]
missing-override-decorator = "error"
missing-type-argument = "error"
division-by-zero = "error"
unsound-assignment = "error"

[tool.uv]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "rocm" },
    ],
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
sixdrepnet360 = { workspace = true }
torch = { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }
triton-rocm = { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "sixdrepnet360[export]",
    "sixdrepnet360[train]",
    "ty>=0.0.84",
]
